# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "79239f951610fa45ab1160d2fe4438f6"
name = "Social Wall"
handle = "cloverkit-social-wall"
application_url = "https://social-wall.cloverkitstudio.com"
embedded = true

[access_scopes]
scopes = "read_customers,read_orders,read_products,read_themes,write_metaobjects,write_metaobject_definitions,write_discounts,read_store_credit_accounts,write_store_credit_account_transactions,write_pixels,read_customer_events"

[webhooks]
api_version = "2026-10"

  # Sales attribution — every order (for % of revenue) + lines the wall drove.
  # Needs protected customer data access (Dev Dashboard → API access).
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = [ "refunds/create" ]
  uri = "/webhooks/refunds/create"

[auth]
redirect_urls = [ "https://social-wall.cloverkitstudio.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true

[app_proxy]
url = "https://social-wall.cloverkitstudio.com/api/proxy"
subpath = "social-wall"
prefix = "apps"

# ── Social Wall ──────────────────────────────────────────────────
# App-owned metaobject mirroring each wall campaign, so merchants can pick one
# in the "Social Wall" theme block. Entries are written by
# app/utils/canvas.server.ts (syncCampaignMetaobjects). `status` lets the block
# hide itself unless the wall campaign is ACTIVE.
[metaobjects.app.ugme_campaign]
name = "Wall campaign"
description = "A Social Wall campaign, selectable in the Social Wall theme block"
display_name_field = "title"
access.admin = "merchant_read"
access.storefront = "public_read"

[metaobjects.app.ugme_campaign.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.ugme_campaign.fields.campaign_id]
name = "Campaign ID"
type = "single_line_text_field"
required = true

[metaobjects.app.ugme_campaign.fields.status]
name = "Status"
type = "single_line_text_field"

[metaobjects.app.ugme_campaign.fields.data_url]
name = "Data URL"
type = "single_line_text_field"
